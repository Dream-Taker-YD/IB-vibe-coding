<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>실천 계획 카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 왼쪽 작성 폼(실천 유형 → 질문) / 오른쪽 완성 카드 미리보기 + 보관함 */
:root{
  --bg:#eef2f3; --paper:#fbfcfc; --ink:#1f2d33; --muted:#5d6f76; --line:#c9d6da;
  --accent:#0f6e7a; --accent-ink:#fff;
  --a1:#2f8a5c; --a2:#c4553a; --a3:#3a68c4; --a4:#c9821a; --a5:#7b55b0;
  --display:"Do Hyeon","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141b1e; --paper:#1b2427; --ink:#e4ecee; --muted:#9db0b6; --line:#2f3e43;
  --accent:#4fc0cc; --accent-ink:#0d1a1d;
  --a1:#5cc08c; --a2:#e8836a; --a3:#7c9fe8; --a4:#e3a64a; --a5:#a988d8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b1e; --paper:#1b2427; --ink:#e4ecee; --muted:#9db0b6; --line:#2f3e43;
  --accent:#4fc0cc; --accent-ink:#0d1a1d;
  --a1:#5cc08c; --a2:#e8836a; --a3:#7c9fe8; --a4:#e3a64a; --a5:#a988d8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1160px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:16px;min-width:0}
.form h1{font-size:32px;line-height:1.1}
.form > header p{margin:4px 0 0;color:var(--muted);font-size:13px}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.types button{font:inherit;text-align:left;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--paper);color:var(--ink);border-radius:6px;padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.types button b{font-family:var(--display);font-weight:400;font-size:17px}
.types button span{font-size:12px;color:var(--muted)}
.types button[aria-pressed="true"]{background:var(--c);color:#fff;border-color:var(--c)}
.types button[aria-pressed="true"] span{color:#fff;opacity:.9}
.hint{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:2px 0 2px 10px}
.field{display:flex;flex-direction:column;gap:4px}
label{font-size:13px}
label small{color:var(--muted)}
input,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));min-width:0}
@media (max-width:860px){.side{position:static}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card .top{background:var(--c);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.card .top h2{font-size:24px}
.card .top span{font-size:13px;opacity:.9}
.card .body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card .act{font-family:var(--display);font-size:22px;line-height:1.3;text-wrap:balance}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.card dt{color:var(--muted)}
.card dd{margin:0;white-space:pre-wrap;word-break:break-word}
.card .sign{border-top:1px dashed var(--line);padding-top:8px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.badge{font-size:12px;padding:1px 8px;border-radius:99px;border:1px dashed currentColor}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:8px 12px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.shelf h3{font-size:18px;margin-bottom:6px}
.shelf ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.shelf li{display:flex;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:6px 8px;font-size:14px}
.shelf li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shelf li button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px}
.shelf li button:hover{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:14px}
</style>

<div class="wrap">
  <section class="form">
    <header>
      <div class="eyebrow">IB PYP · 실천(Action)</div>
      <h1>실천 계획 카드</h1>
      <p>탐구로 알게 된 것을 내 삶과 공동체에서 행동으로 옮겨 봐요.</p>
    </header>
    <div>
      <div class="eyebrow" style="margin-bottom:6px">1. 어떤 실천인가요?</div>
      <div class="types" id="types" role="group" aria-label="실천 유형"></div>
    </div>
    <p class="hint" id="hint"></p>
    <div class="eyebrow">2. 계획을 세워요</div>
    <div class="field"><label for="topic">탐구 주제</label><input id="topic"></div>
    <div class="field"><label for="learned">탐구하며 알게 된 것 <small>왜 실천하고 싶어졌나요?</small></label><textarea id="learned" rows="2"></textarea></div>
    <div class="field"><label for="action">나의 실천 <small>무엇을 할 건가요? 구체적으로</small></label><textarea id="action" rows="2"></textarea></div>
    <div class="two">
      <div class="field"><label for="when">언제·얼마나</label><input id="when"></div>
      <div class="field"><label for="with">누구와·어디서</label><input id="with"></div>
    </div>
    <div class="field"><label for="need">필요한 것·도움받을 사람</label><input id="need"></div>
    <div class="field"><label for="check">잘했는지 어떻게 확인할까요?</label><input id="check"></div>
    <div class="field"><label for="name">이름</label><input id="name"></div>
  </section>

  <aside class="side">
    <div class="card" id="card" aria-live="polite"></div>
    <div class="row">
      <button class="btn primary" id="keep" type="button">보관함에 저장</button>
      <button class="btn" id="copy" type="button">텍스트로 복사</button>
      <button class="btn" id="new" type="button">새 카드</button>
    </div>
    <textarea id="fallback" rows="8" hidden readonly aria-label="복사할 텍스트"></textarea>
    <div class="shelf"><h3>내 실천 카드 보관함</h3><ul id="shelf"></ul></div>
  </aside>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const T=[
 {k:"part",n:"참여",en:"Participation",c:"var(--a1)",d:"학급·학교·마을 활동에 적극적으로 함께해요.",ex:"학교 텃밭 물 주기 당번에 지원하기"},
 {k:"adv",n:"옹호",en:"Advocacy",c:"var(--a2)",d:"중요한 문제를 알리고 다른 사람의 생각을 바꾸도록 목소리를 내요.",ex:"물 아끼기 포스터를 만들어 복도에 붙이기"},
 {k:"just",n:"사회 정의",en:"Social justice",c:"var(--a3)",d:"모두가 공정하게 대우받도록 불평등이나 소외를 바로잡아요.",ex:"전학 온 친구가 모둠에 잘 섞이도록 돕기"},
 {k:"ent",n:"사회적 기업가정신",en:"Social entrepreneurship",c:"var(--a4)",d:"창의적인 아이디어로 공동체의 문제를 해결하는 일을 만들어요.",ex:"안 쓰는 학용품 나눔 장터 열기"},
 {k:"life",n:"생활방식 선택",en:"Lifestyle choices",c:"var(--a5)",d:"나의 생활 습관을 스스로 바꾸어 실천해요.",ex:"양치할 때 컵 사용하기"}
];
const F=["topic","learned","action","when","with","need","check","name"];
const PH={topic:"예: 우리 지역의 물 문제",learned:"예: 우리 지역도 여름 가뭄 때 물이 부족해진다는 것을 알았어요.",action:"예: 가족과 함께 물 절약 약속표를 만들어 지켜요.",when:"예: 2주 동안 매일",with:"예: 가족과 집에서",need:"예: 약속표 종이, 부모님 도움",check:"예: 약속표에 매일 스티커를 붙여 확인해요."};
const KEY="action-plan-card-v1";
const SAMPLE={type:"life",sample:true,topic:"우리 지역의 물 문제",learned:"여름 가뭄 때 우리 지역도 물이 부족해질 수 있다는 것을 알았어요.",action:"가족과 물 절약 약속표를 만들어 2주 동안 지켜요.",when:"2주 동안 매일",with:"가족과 집에서",need:"약속표 종이, 부모님 도움",check:"약속표에 매일 스티커를 붙여 확인해요.",name:"예시"};
let st,shelf=[];
try{st=JSON.parse(localStorage.getItem(KEY+":cur"));shelf=JSON.parse(localStorage.getItem(KEY+":shelf"))||[]}catch(e){}
if(!st)st={...SAMPLE};
const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function save(){try{localStorage.setItem(KEY+":cur",JSON.stringify(st));localStorage.setItem(KEY+":shelf",JSON.stringify(shelf))}catch(e){}}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}
const type=()=>T.find(t=>t.k===st.type)||T[0];

function renderTypes(){
 $("types").innerHTML=T.map(t=>`<button type="button" style="--c:${t.c}" data-k="${t.k}" aria-pressed="${t.k===st.type}"><b>${t.n}</b><span>${t.en}</span></button>`).join("");
 const t=type();$("hint").innerHTML=`<b>${t.n}</b>: ${t.d}<br>예) ${t.ex}`;
}
function renderCard(){
 const t=type();
 $("card").style.setProperty("--c",t.c);
 $("card").innerHTML=`<div class="top"><h2>${t.n} 실천</h2><span>${esc(st.topic)||"탐구 주제"}</span></div>
 <div class="body">
  <div class="act">${esc(st.action)||"나의 실천을 써 보세요"}</div>
  <dl>
   <dt>왜</dt><dd>${esc(st.learned)||"–"}</dd>
   <dt>언제</dt><dd>${esc(st.when)||"–"}</dd>
   <dt>누구와</dt><dd>${esc(st.with)||"–"}</dd>
   <dt>필요한 것</dt><dd>${esc(st.need)||"–"}</dd>
   <dt>확인 방법</dt><dd>${esc(st.check)||"–"}</dd>
  </dl>
  <div class="sign"><span>다짐한 사람: ${esc(st.name)||"____"}</span>${st.sample?'<span class="badge">예시 카드</span>':""}</div>
 </div>`;
}
function renderShelf(){
 $("shelf").innerHTML=shelf.length?shelf.map((s,i)=>{const t=T.find(x=>x.k===s.type)||T[0];return `<li style="--c:${t.c}"><span>[${t.n}] ${esc(s.action)}</span><button type="button" data-open="${i}">열기</button><button type="button" data-del="${i}" aria-label="삭제">삭제</button></li>`}).join(""):'<li style="--c:var(--line)"><span style="color:var(--muted)">저장한 카드가 여기에 모여요.</span></li>';
}
function fill(){F.forEach(f=>{$(f).value=st[f]||"";$(f).placeholder=PH[f]||""})}
function render(){renderTypes();renderCard();renderShelf();save()}
function unsample(){if(st.sample){st.sample=false;if(st.name==="예시"){st.name="";$("name").value=""}}}

$("types").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.type=b.dataset.k;unsample();render()};
F.forEach(f=>$(f).addEventListener("input",e=>{st[f]=e.target.value;if(f!=="name")unsample();else st.sample=false;renderCard();save()}));
$("keep").onclick=()=>{if(!st.action||!st.action.trim()){toast("'나의 실천'을 먼저 써 주세요");$("action").focus();return}
 const c={...st,sample:false,id:st.id||Date.now()};st.id=c.id;const i=shelf.findIndex(x=>x.id===c.id);if(i>=0)shelf[i]=c;else shelf.unshift(c);renderShelf();save();toast("보관함에 저장했어요")};
$("new").onclick=()=>{st={type:st.type,sample:false,name:st.sample?"":st.name};fill();render();$("topic").focus()};
$("shelf").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.open!==undefined){st={...shelf[+b.dataset.open]};fill();render();toast("카드를 열었어요")}
 else{shelf.splice(+b.dataset.del,1);renderShelf();save()}};
$("copy").onclick=()=>{const t=type();
 const txt=`[실천 계획 카드] ${t.n}(${t.en})\n탐구 주제: ${st.topic||""}\n나의 실천: ${st.action||""}\n왜: ${st.learned||""}\n언제: ${st.when||""}\n누구와·어디서: ${st.with||""}\n필요한 것: ${st.need||""}\n확인 방법: ${st.check||""}\n다짐한 사람: ${st.name||""}`;
 const fb=$("fallback");const fail=()=>{fb.value=txt;fb.hidden=false;fb.focus();fb.select();toast("아래 글을 직접 복사해 주세요")};
 try{navigator.clipboard.writeText(txt).then(()=>{fb.hidden=true;toast("복사했어요")},fail)}catch(e){fail()}};
fill();render();
</script>

</body></html>
